name: Проверка деплоя
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: technomaster-deploy
      - uses: actions/checkout@v4
        with:
          repository: your0kk/technomaster
          ref: e06e7f0d3ca9b5fd28ab08f629940d48b00b3dc7
          path: webka
      - name: Проверка Compose
        working-directory: technomaster-deploy
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
        run: |
          touch ../webka/.env.local
          docker compose -f deploy/docker-compose.yml config --quiet
      - name: Сборка приложения
        working-directory: webka
        run: docker build -t technomaster:ci .
      - name: Проверка контейнера
        working-directory: webka
        run: node scripts/check-container.mjs technomaster:ci
      - name: Проверка nginx
        working-directory: technomaster-deploy
        run: |
          mkdir -p deploy/certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=technomaster.localhost' -keyout deploy/certs/technomaster.localhost-key.pem -out deploy/certs/technomaster.localhost.pem
          docker network create deploy-check
          docker run -d --name app --network deploy-check technomaster:ci
          docker run --rm --network deploy-check -v "$PWD/deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro" -v "$PWD/deploy/certs:/etc/nginx/certs:ro" nginx:1.30-alpine nginx -t

